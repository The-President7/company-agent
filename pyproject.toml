[project]
name = "company-secretary"
version = "0.1.0"
description = "A source-aware company operations agent and web application monitoring platform"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.39,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "reportlab>=4.2,<5",
]

[project.scripts]
secretary-api = "api:run"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["api", "app", "config", "db", "models", "services"]
